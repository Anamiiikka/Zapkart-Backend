version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=zapkart
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # PostGIS-enabled image — the schema calls CREATE EXTENSION postgis,
    # which the plain postgres image cannot satisfy.
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=zapkart
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: migrations are applied in the correct, tracked order by
      # `node db/migrate.js` (run from the app's start command). We deliberately
      # do NOT mount ./db/migrations into docker-entrypoint-initdb.d, because
      # Postgres would execute those files alphabetically (add_*, agents, init…),
      # applying them out of dependency order and breaking the schema.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
